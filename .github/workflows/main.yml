name: MLOps Project Check

on:
  push:
    branches:
      - main

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r MLOPS_LAB/requirements.txt

      - name: Run Training Script
        run: |
          cd MLOPS_LAB
          python src/train.py

      - name: Check Result Files
        run: |
          test -f MLOPS_ALB/results/step1_tracking.json
          echo "✅ step1_tracking.json exists"

      - name: Success
        run: echo "Workflow completed successfully!"
