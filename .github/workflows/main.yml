name: MLOps Project Grader

on:
  push:
    branches:
      - main

jobs:
  grade-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r MLOPS_LAB/requirements.txt

      - name: Run Training Script
        run: |
          cd MLOPS_LAB
          python src/train.py

      - name: Grade Project
        run: |
          score=0

          echo "========== GRADING =========="

          if [ -f MLOPS_LAB/results/step1_tracking.json ]; then
            echo "✅ Step 1 Tracking: 25/25"
            score=$((score+25))
          else
            echo "❌ Step 1 Tracking: 0/25"
          fi

          if [ -f MLOPS_LAB/results/step2_serving.json ]; then
            echo "✅ Step 2 Serving: 25/25"
            score=$((score+25))
          else
            echo "❌ Step 2 Serving: 0/25"
          fi

          if [ -f MLOPS_LAB/results/step3_monitoring.json ]; then
            echo "✅ Step 3 Monitoring: 25/25"
            score=$((score+25))
          else
            echo "❌ Step 3 Monitoring: 0/25"
          fi

          if [ -f MLOPS_LAB/results/step4_retraining.json ]; then
            echo "✅ Step 4 Retraining: 25/25"
            score=$((score+25))
          else
            echo "❌ Step 4 Retraining: 0/25"
          fi

          echo ""
          echo "🎯 FINAL SCORE: $score / 100"
